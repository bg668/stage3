providers:
  deepseek:
    type: deepseek
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    request_timeout_seconds: 180
    sdk_max_retries: 0

  # 示例：内部 OpenAI-compatible 网关。未使用时可保留或删除。
  internal:
    type: openai_compatible
    base_url: "https://example.invalid/v1"
    api_key_env: "INTERNAL_API_KEY"
    request_timeout_seconds: 180
    sdk_max_retries: 0

models:
  investigator:
    provider: deepseek
    model_name: "deepseek-chat"
    api_mode: chat
    output_mode: tool
    # omit = 完全不发送 reasoning/thinking 字段；disabled = 显式 thinking=false。
    reasoning: omit
    temperature: null
    stream_output: true

  reviewer_fast:
    provider: deepseek
    model_name: "deepseek-chat"
    api_mode: chat
    output_mode: tool
    reasoning: omit
    temperature: null
    stream_output: true

  # Format repair is a clean-context, plain-text JSON repair model.
  # It can be replaced with a cheaper model that is reliable at JSON formatting.
  repair_fast:
    provider: deepseek
    model_name: "deepseek-chat"
    api_mode: chat
    output_mode: prompted
    reasoning: omit
    temperature: 0
    stream_output: true

  global_reconciler:
    provider: deepseek
    model_name: "deepseek-chat"
    api_mode: chat
    output_mode: tool
    reasoning: omit
    temperature: null
    stream_output: true

stages:
  analyzer:
    model: investigator
    max_output_tokens: 40960
  reviewer:
    model: reviewer_fast
    max_output_tokens: 15360
  reviser:
    model: investigator
    max_output_tokens: 20480
  format_repair:
    model: repair_fast
    max_output_tokens: 40960
  # v0.7: relationship decisions only; canonical facts are assembled by Python.
  global_reconciliation:
    model: global_reconciler
    max_output_tokens: 40960
  # v0.8: ID-only cleanup of stale historical gaps after canonical facts exist.
  gap_reconciliation:
    model: global_reconciler
    max_output_tokens: 15360

workflow:
  max_model_requests: 3
  total_tokens_limit: 130000
  wall_clock_seconds: 600
  output_retries: 0
  enable_revision: true

format_repair:
  enabled: true
  max_attempts: 3
  total_tokens_limit: 240000
  deterministic_cleanup: true

global_reconciliation:
  enabled: true
  max_model_requests: 1
  total_tokens_limit: 160000
  wall_clock_seconds: 300

gap_reconciliation:
  enabled: true
  max_model_requests: 1
  total_tokens_limit: 60000
  wall_clock_seconds: 120

batch:
  concurrency: 4

logging:
  level: "INFO"
  console: true
  file: "logs/bounded_investigator.log"
